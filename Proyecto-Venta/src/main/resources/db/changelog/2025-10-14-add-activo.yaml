databaseChangeLog:
  - changeSet:
      id: add-activo-categoria
      author: nico
      preConditions:
        onFail: MARK_RAN
        onError: HALT
        not:
          columnExists:
            tableName: categoria
            columnName: activo
      changes:
        - addColumn:
            tableName: categoria
            columns:
              - column:
                  name: activo
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: categoria
            columnName: activo

