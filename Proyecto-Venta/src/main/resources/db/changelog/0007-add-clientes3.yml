            tableName: cliente
            columns:
              - column: { name: nombre,   value: "Ferretería San José" }
              - column: { name: ruc,      value: "80555555-1" }
              - column: { name: telefono, value: "+595 971 555 000" }
              - column: { name: correo,   value: "contacto@ferreteriasanjose.com" }
              - column: { name: direccion,value: "Av. Artigas 123, Asunción" }
      rollback:
        - delete:
            tableName: cliente
            where: ruc IN ('80012345-6','80054321-0','80111222-3','80133777-9','80099887-5','80222444-1','80333555-2','80444666-3')