databaseChangeLog:
  - changeSet:
      id: 0003-personas-seguridad
      author: Nicolas
      changes:
        # === PROVEEDOR
        - createTable:
            tableName: proveedor
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: nombre, type: VARCHAR(200), constraints: { nullable: false } }
              - column: { name: ruc, type: VARCHAR(50) }
              - column: { name: telefono, type: VARCHAR(50) }
              - column: { name: correo, type: VARCHAR(200) }
              - column: { name: direccion, type: TEXT }
              - column: { name: activo, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }

        - addUniqueConstraint:
            tableName: proveedor
            columnNames: nombre, ruc
            constraintName: uq_proveedor_nombre_ruc

        # === CLIENTE
        - createTable:
            tableName: cliente
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: nombre, type: VARCHAR(75), constraints: { nullable: false } }
              - column: { name: ruc, type: VARCHAR(50) }
              - column: { name: telefono, type: VARCHAR(50) }
              - column: { name: correo, type: VARCHAR(200) }
              - column: { name: direccion, type: VARCHAR(200) }

        - addUniqueConstraint:
            tableName: cliente
            columnNames: ruc
            constraintName: uq_cliente_ruc

        # === USUARIO
        - createTable:
            tableName: usuario
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: usuario, type: VARCHAR(80), constraints: { nullable: false, unique: true } }
              - column: { name: contrasena, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: nombre_completo, type: VARCHAR(200), constraints: { nullable: false } }

        # === ROL
        - createTable:
            tableName: rol
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: nombre, type: VARCHAR(50), constraints: { nullable: false, unique: true } }

        # === USUARIO_ROL (N:M)
        - createTable:
            tableName: usuario_rol
            columns:
              - column: { name: usuario_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: rol_id, type: BIGINT, constraints: { nullable: false } }

        - addPrimaryKey:
            tableName: usuario_rol
            columnNames: usuario_id, rol_id
            constraintName: pk_usuario_rol

        - addForeignKeyConstraint:
            baseTableName: usuario_rol
            baseColumnNames: usuario_id
            constraintName: fk_usuario_rol_usuario
            referencedTableName: usuario
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: usuario_rol
            baseColumnNames: rol_id
            constraintName: fk_usuario_rol_rol
            referencedTableName: rol
            referencedColumnNames: id
            onDelete: CASCADE
