spring.application.name=proyecto-venta
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/ferreteria}
spring.datasource.username=${DB_USER:ferreteria_app}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=venta-pool

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.liquibase.enabled=false

eureka.instance.hostname=proyecto-venta
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

security.jwt.issuer=${JWT_ISSUER:proyectodistri}
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
security.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASS}
spring.data.redis.database=${REDIS_DB:0}
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=${CACHE_PREFIX:ferreteria:}

cache.ttl.categorias=60
cache.ttl.clientes=15
cache.ttl.compras=5
cache.ttl.productos=10
cache.ttl.proveedores=30
