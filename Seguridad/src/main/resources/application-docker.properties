spring.application.name=Seguridad
server.port=8083

spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/ferreteria}
spring.datasource.username=${DB_USER:ferreteria_app}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

security.jwt.issuer=${JWT_ISSUER:proyectodistri}
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
security.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

eureka.instance.hostname=seguridad
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

