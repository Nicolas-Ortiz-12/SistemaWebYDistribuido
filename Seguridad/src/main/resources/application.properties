spring.application.name=Seguridad

# ---- Secretos (DB_URL, DB_USER, DB_PASS, JWT_SECRET) fuera del repo; las variables de entorno tienen prioridad ----
spring.config.import=optional:file:${SISTEMAWEB_SECRETS:${user.home}/.sistemaweb/secrets.properties}
server.port=8083

# Datasource (variables de entorno)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Jackson
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# JWT
security.jwt.issuer=proyectodistri
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=480
security.jwt.refresh-expiration-days=7  




# ---- Eureka ----
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# ---- Redis como backend de cache (usuarios autenticados) ----
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=${CACHE_PREFIX:seguridad:}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASS:}
spring.data.redis.database=${REDIS_DB:0}

# ---- Logging ----
logging.file.name=logs/seguridad.log
