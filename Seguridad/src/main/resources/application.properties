spring.application.name=Seguridad

# ---- Secretos (DB_URL, DB_USER, DB_PASS, JWT_SECRET) fuera del repo; las variables de entorno tienen prioridad ----
spring.config.import=optional:file:${SISTEMAWEB_SECRETS:${user.home}/.sistemaweb/secrets.properties}
server.port=8083

# Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ferreteria}
spring.datasource.username=${DB_USER:ferreteria_app}
spring.datasource.password=${DB_PASS:change-me-in-dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Jackson
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

