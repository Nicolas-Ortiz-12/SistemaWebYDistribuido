spring.application.name=Seguridad
server.port=8083

# Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ferreteria}
spring.datasource.username=${DB_USER:ferreteria_app}
spring.datasource.password=${DB_PASS:change-me-in-dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Jackson
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# JWT
security.jwt.issuer=${JWT_ISSUER:proyectodistri}
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
security.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}
