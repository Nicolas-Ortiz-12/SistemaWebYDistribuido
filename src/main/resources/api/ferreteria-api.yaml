openapi: 3.0.3
info:
  title: Ferreteria (DTOs)
  version: 1.0.0
  description: Esquemas usados para generar DTOs con openapi-generator.
paths: {}

components:
  schemas:
    # ================== BASE ==================
    BaseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64

    # ================== CATALOGO ==================
    CategoriaDTO:
      allOf:
        - $ref: '#/components/schemas/BaseDTO'
        - type: object
          properties:
            nombre:
              type: string
              maxLength: 120
          required: [nombre]

    DetalleProductoDTO:
      allOf:
        - $ref: '#/components/schemas/BaseDTO'
        - type: object
          properties:
            descripcion:
              type: string
              maxLength: 250
            unidadMedida:
              type: string
              maxLength: 20
              default: "UN"

    ProductoDTO:
      allOf:
        - $ref: '#/components/schemas/BaseDTO'
        - type: object
          properties:
            codigo:
              type: string
              maxLength: 64
            nombre:
              type: string
              maxLength: 200
            categoriaId:
              type: integer
              format: int64
              nullable: true
            costo:
              type: number
              format: double
              default: 0
            precio:
              type: number
              format: double
              default: 0
            stockMinimo:
              type: number
              format: double
              default: 0
            detalle:
              $ref: '#/components/schemas/DetalleProductoDTO'
          required: [codigo, nombre]


    ClienteDTO:
      allOf:
        - $ref: '#/components/schemas/BaseDTO'
        - type: object
          properties:
            nombre:
              type: string
              maxLength: 75
            ruc:
              type: string
              maxLength: 50
              nullable: true
            telefono:
              type: string
              maxLength: 50
              nullable: true
            correo:
              type: string
              maxLength: 200
              nullable: true
            direccion:
              type: string
              maxLength: 200
              nullable: true
          required: [nombre]

    ProveedorDTO:
      allOf:
        - $ref: '#/components/schemas/BaseDTO'
        - type: object
          properties:
            nombre:
              type: string
              maxLength: 200
            ruc:
              type: string
              maxLength: 50
              nullable: true
            telefono:
              type: string
              maxLength: 50
              nullable: true
            correo:
              type: string
              maxLength: 200
              nullable: true
            direccion:
              type: string
              nullable: true
            activo:
              type: boolean
              default: true
          required: [nombre]

    # ================== SEGURIDAD ==================
    RolDTO:
      allOf:
        - $ref: '#/components/schemas/BaseDTO'
        - type: object
          properties:
            nombre:
              type: string
              maxLength: 50
          required: [nombre]

    UsuarioDTO:
      allOf:
        - $ref: '#/components/schemas/BaseDTO'
        - type: object
          properties:
            usuario:
              type: string
              maxLength: 80
            nombreCompleto:
              type: string
              maxLength: 200
            roles:
              type: array
              items:
                $ref: '#/components/schemas/RolDTO'
          required: [usuario, nombreCompleto]


    # ================== VENTAS ==================
    VentaDetalleDTO:
      type: object
      properties:
        productoId:
          type: integer
          format: int64
        cantidad:
          type: number
          format: double
        precioUnitario:
          type: number
          format: double
        tasaIva:
          type: number
          format: double
          nullable: true
          default: 10
        subtotalLinea:
          type: number
          format: double
          nullable: true
        totalLinea:
          type: number
          format: double
          nullable: true
      required: [productoId, cantidad, precioUnitario]

    VentaDTO:
      allOf:
        - $ref: '#/components/schemas/BaseDTO'
        - type: object
          properties:
            clienteId:
              type: integer
              format: int64
              nullable: true
            fechaVenta:
              type: string
              format: date-time
            subtotal:
              type: number
              format: double
              default: 0
            iva:
              type: number
              format: double
              default: 0
            total:
              type: number
              format: double
              default: 0
            creadoPorId:
              type: integer
              format: int64
              nullable: true
            items:
              type: array
              items:
                $ref: '#/components/schemas/VentaDetalleDTO'
          required: [fechaVenta, total]

    # ================== COMPRAS ==================
    CompraDetalleDTO:
      type: object
      properties:
        productoId:
          type: integer
          format: int64
        cantidad:
          type: number
          format: double
        costoUnitario:
          type: number
          format: double
        tasaIva:
          type: number
          format: double
          default: 10
        subtotalLinea:
          type: number
          format: double
          nullable: true
        totalLinea:
          type: number
          format: double
          nullable: true
      required: [productoId, cantidad, costoUnitario]

    CompraDTO:
      allOf:
        - $ref: '#/components/schemas/BaseDTO'
        - type: object
          properties:
            proveedorId:
              type: integer
              format: int64
            serie:
              type: string
              maxLength: 20
              nullable: true
            numero:
              type: string
              maxLength: 40
              nullable: true
            fechaEmision:
              type: string
              format: date
            estado:
              type: string
              maxLength: 20
              default: "CONFIRMADO"
            subtotal:
              type: number
              format: double
              default: 0
            iva:
              type: number
              format: double
              default: 0
            total:
              type: number
              format: double
              default: 0
            creadoEn:
              type: string
              format: date-time
            detalles:
              type: array
              items:
                $ref: '#/components/schemas/CompraDetalleDTO'
          required: [proveedorId, fechaEmision, estado, total]


    # ---- Compra (ingreso por factura)
    CompraDetalleRequestDTO:
      type: object
      properties:
        productoId: { type: integer, format: int64 }
        cantidad: { type: number, format: double }
        costoUnitario: { type:
          number, format: double }
        tasaIva: { type: number, format: double, default: 10 }
      required: [ productoId, cantidad, costoUnitario ]

    CompraRequestDTO:
      type: object
      properties:
        proveedorId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        serie: { type: string, maxLength: 20, nullable: true }
        numero: { type: string, maxLength: 40, nullable: true }
        fechaEmision: { type:
          string, format: date }
        detalles:
          type: array
          items: { $ref: '#/components/schemas/CompraDetalleRequestDTO' }
      required: [ proveedorId, warehouseId, fechaEmision, detalles ]

    CompraDetalleResponseDTO:
      allOf:
        - type: object
          properties:
            productoId: { type: integer, format: int64 }
            cantidad: { type: number, format: double }
            costoUnitario: { type:
              number, format: double }
            tasaIva: { type: number, format: double }
            subtotalLinea: { type:
              number, format: double }
            totalLinea: { type: number, format: double }

    CompraResponseDTO:
      allOf:
        - $ref: '#/components/schemas/BaseDTO'
        - type: object
          properties:
            proveedorId: { type: integer, format: int64 }
            warehouseId: { type: integer, format: int64 }
            serie: { type: string, maxLength: 20, nullable: true }
            numero: { type: string, maxLength: 40, nullable: true }
            fechaEmision: { type:
              string, format: date }
            estado: { type: string, default: "CONFIRMADO" }
            currency: { type: string, maxLength: 3, default: "PYG" }
            subtotal: { type: number, format: double }
            iva: { type: number, format: double }
            total: { type: number, format: double }
            creadoEn: { type: string, format: date-time }
            detalles:
              type: array
              items: { $ref: '#/components/schemas/CompraDetalleResponseDTO' }
          required: [ proveedorId, warehouseId, fechaEmision, total ]

    # ---- Venta / Facturación
    VentaDetalleRequestDTO:
      type: object
      properties:
        productoId: { type: integer, format: int64 }
        cantidad: { type: number, format: double }
        precioUnitario: { type:
          number, format: double }
        tasaIva: { type: number, format: double, default: 10 }
      required: [ productoId, cantidad, precioUnitario ]

    VentaRequestDTO:
      type: object
      properties:
        clienteId: { type: integer, format: int64, nullable: true }
        warehouseId: { type:
          integer, format: int64 }
        serie: { type: string, maxLength: 20, nullable: true }
        numero: { type: string, maxLength: 40, nullable: true }
        fechaVenta: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/VentaDetalleRequestDTO' }
      required: [ warehouseId, fechaVenta, items ]

    VentaDetalleResponseDTO:
      type: object
      properties:
        productoId: { type: integer, format: int64 }
        cantidad: { type: number, format: double }
        precioUnitario: { type:
          number, format: double }
        tasaIva: { type: number, format: double }
        subtotalLinea: { type: number, format: double }
        totalLinea: { type: number, format: double }

    VentaResponseDTO:
      allOf:
        - $ref: '#/components/schemas/BaseDTO'
        - type: object
          properties:
            clienteId: { type: integer, format: int64, nullable: true }
            warehouseId: { type:
              integer, format: int64 }
            serie: { type: string, maxLength: 20, nullable: true }
            numero: { type: string, maxLength: 40, nullable: true }
            fechaVenta: { type: string, format: date-time }
            estado: { type: string, default: "CONFIRMADO" }
            currency: { type: string, maxLength: 3, default: "PYG" }
            subtotal: { type: number, format: double }
            iva: { type: number, format: double }
            total: { type: number, format: double }
            creadoPorId: { type:
              integer, format:
                int64, nullable: true }
            items:
              type: array
              items: { $ref: '#/components/schemas/VentaDetalleResponseDTO' }
          required: [ warehouseId, fechaVenta, total ]




