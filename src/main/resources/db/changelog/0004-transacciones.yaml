databaseChangeLog:
  - changeSet:
      id: 0004-transacciones
      author: Carlos
      changes:
        # === COMPRA
        - createTable:
            tableName: compra
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: proveedor_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: serie, type: VARCHAR(20) }
              - column: { name: numero, type: VARCHAR(40) }
              - column: { name: fecha_emision, type: DATE, defaultValueComputed: "CURRENT_DATE", constraints: { nullable: false } }
              - column: { name: estado, type: VARCHAR(20), defaultValue: "'CONFIRMADO'", constraints: { nullable: false } }
              - column: { name: subtotal, type: "NUMERIC(14,2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: iva, type: "NUMERIC(14,2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: total, type: "NUMERIC(14,2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: creado_en, type: TIMESTAMP, defaultValueComputed: "NOW()", constraints: { nullable: false } }

        - addForeignKeyConstraint:
            baseTableName: compra
            baseColumnNames: proveedor_id
            constraintName: fk_compra_proveedor
            referencedTableName: proveedor
            referencedColumnNames: id

        - addUniqueConstraint:
            tableName: compra
            columnNames: proveedor_id, serie, numero
            constraintName: uq_compra_proveedor_serie_numero

        # === COMPRA_DETALLE
        - createTable:
            tableName: compra_detalle
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: compra_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: producto_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: cantidad, type: "NUMERIC(14,3)", constraints: { nullable: false } }
              - column: { name: costo_unitario, type: "NUMERIC(14,2)", constraints: { nullable: false } }
              - column: { name: tasa_iva, type: "NUMERIC(5,2)", defaultValueNumeric: 10.00, constraints: { nullable: false } }
              - column: { name: subtotal_linea, type: "NUMERIC(14,2)" }
              - column: { name: total_linea, type: "NUMERIC(14,2)" }

        - addForeignKeyConstraint:
            baseTableName: compra_detalle
            baseColumnNames: compra_id
            constraintName: fk_compra_detalle_compra
            referencedTableName: compra
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: compra_detalle
            baseColumnNames: producto_id
            constraintName: fk_compra_detalle_producto
            referencedTableName: producto
            referencedColumnNames: id

        - addUniqueConstraint:
            tableName: compra_detalle
            columnNames: compra_id, producto_id
            constraintName: uq_compra_detalle_compra_producto

        # === VENTA
        - createTable:
            tableName: venta
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: cliente_id, type: BIGINT }
              - column: { name: fecha_venta, type: TIMESTAMP, defaultValueComputed: "NOW()", constraints: { nullable: false } }
              - column: { name: subtotal, type: "NUMERIC(14,2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: iva, type: "NUMERIC(14,2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: total, type: "NUMERIC(14,2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: creado_por, type: BIGINT }

        - addForeignKeyConstraint:
            baseTableName: venta
            baseColumnNames: cliente_id
            constraintName: fk_venta_cliente
            referencedTableName: cliente
            referencedColumnNames: id

        - addForeignKeyConstraint:
            baseTableName: venta
            baseColumnNames: creado_por
            constraintName: fk_venta_usuario
            referencedTableName: usuario
            referencedColumnNames: id

        # === VENTA_DETALLE
        - createTable:
            tableName: venta_detalle
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: venta_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: producto_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: cantidad, type: "NUMERIC(14,3)", constraints: { nullable: false } }
              - column: { name: precio_unitario, type: "NUMERIC(14,2)", constraints: { nullable: false } }
              - column: { name: tasa_iva, type: "NUMERIC(5,2)", defaultValueNumeric: 10.00, constraints: { nullable: false } }
              - column: { name: subtotal_linea, type: "NUMERIC(14,2)" }
              - column: { name: total_linea, type: "NUMERIC(14,2)" }

        - addForeignKeyConstraint:
            baseTableName: venta_detalle
            baseColumnNames: venta_id
            constraintName: fk_venta_detalle_venta
            referencedTableName: venta
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: venta_detalle
            baseColumnNames: producto_id
            constraintName: fk_venta_detalle_producto
            referencedTableName: producto
            referencedColumnNames: id

        - addUniqueConstraint:
            tableName: venta_detalle
            columnNames: venta_id, producto_id
            constraintName: uq_venta_detalle_venta_producto
