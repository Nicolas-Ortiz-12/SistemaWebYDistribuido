server:
  port: 8080

spring:
  application:
    name: msvc-gateway
  cloud:
    gateway:
      mvc:
        discovery:
          locator:
            enabled: true
        routes:
          - id: auth
            uri: http://localhost:8083
            predicates:
              - Path=/auth/**,/users/**
          - id: ventas
            uri: http://localhost:8081
            predicates:
              - Path=/ventas/**,/categorias/**,/clientes/**,/productos/**,/proveedores/**


          - id: compras
            uri: http://localhost:8082
            predicates:
              - Path=/compras/**
security:
  jwt:
    secret: cambia-esto-por-un-secret-muy-largo-y-aleatorio
    issuer: proyectodistri
    expiration-minutes: 60