# =====================================================================
#  Balanceador de carga de la UI  (lo instala infra/cluster.ps1 apache)
#  Los valores @...@ se reemplazan con infra/cluster.config.ps1
# =====================================================================

# ---------- Monitoreo del estado ----------
ExtendedStatus On

# Estado general de Apache (workers, requests, tráfico)
<Location "/server-status">
    SetHandler server-status
    Require ip 127.0.0.1 ::1 10 172.16.0.0/12 192.168 100.64.0.0/10
</Location>

# Estado de cada Tomcat del balanceador (Ok / Err / health check),
# permite deshabilitar o drenar un nodo desde el navegador
<Location "/balancer-manager">
    SetHandler balancer-manager
    Require ip 127.0.0.1 ::1 10 172.16.0.0/12 192.168 100.64.0.0/10
</Location>

# ---------- Headers de seguridad ----------
# CSP: el front solo carga scripts, estilos e imágenes propios y solo habla con su origen
# (la API va por /api/). Bloquea scripts inyectados aunque se colara un XSS.
# Las páginas de diagnóstico (balancer-manager, server-status, session.jsp) usan estilos inline.
Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" "expr=%{REQUEST_URI} !~ m#^/(balancer-manager|server-status|session\.jsp)#"
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "same-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"

# Las respuestas de la API tienen datos del negocio: que el navegador no las guarde en caché
<Location "/api/">
    Header always set Cache-Control "no-store"
</Location>

# ---------- Balanceo de los Tomcats de UI ----------
# Sticky session: en la primera respuesta se guarda en la cookie ROUTEID el
# jvmRoute del Tomcat elegido; los pedidos siguientes vuelven a ese mismo nodo.
Header add Set-Cookie "ROUTEID=.%{BALANCER_WORKER_ROUTE}e; path=/" env=BALANCER_ROUTE_CHANGED

<Proxy "balancer://uicluster">
    # Health check por AJP CPING cada 5 s: si un Tomcat cae se marca en error
    # y el tráfico pasa al otro; al volver se reincorpora solo.
    BalancerMember "ajp://@UI1_HOST@:@UI1_AJP@" route=ui1 secret=@AJP_SECRET@ hcmethod=CPING hcinterval=5 hcpasses=1 hcfails=1 retry=5
    BalancerMember "ajp://@UI2_HOST@:@UI2_AJP@" route=ui2 secret=@AJP_SECRET@ hcmethod=CPING hcinterval=5 hcpasses=1 hcfails=1 retry=5
    ProxySet lbmethod=byrequests stickysession=ROUTEID
</Proxy>

ProxyPass        "/balancer-manager" !
ProxyPass        "/server-status" !

# API: el front llama a /api/... y Apache lo reenvía al API Gateway
ProxyPass        "/api/" "http://@GATEWAY_HOST@:8080/"
ProxyPassReverse "/api/" "http://@GATEWAY_HOST@:8080/"

# Todo lo demás es la UI, repartida entre los Tomcats
ProxyPass        "/" "balancer://uicluster/"
ProxyPassReverse "/" "balancer://uicluster/"
